name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------------------------------------
      # IMZA ANAHTARI (v2 - guclendirilmis)
      # - keystore.enc depodan cozulur ve GECERLILIGI test edilir
      #   (openssl yanlis sifreyi SESSIZCE bozuk dosya uretir; o yuzden keytool ile dogrulariz)
      # - gecersizse yeni anahtar uretilir, depoya yazilir, PARMAK IZI imza.txt'ye yazilir
      # - imza.txt VARSA ve anahtar uyusmuyorsa derleme HATA verir
      #   -> bir daha asla sessizce "ustune kurulmayan" APK cikmaz
      # ------------------------------------------------------------------
      - name: Imza anahtarini hazirla (dogrulamali)
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -e
          if [ -z "$KS_PASS" ]; then echo "::error::KEYSTORE_PASS gizli anahtari tanimli degil (Settings > Secrets and variables > Actions)"; exit 1; fi
          mkdir -p ~/.android
          parmakizi() { keytool -list -v -keystore "$1" -storepass android -alias androiddebugkey 2>/dev/null | grep -m1 'SHA256:' | sed 's/^[[:space:]]*//'; }
          YENI=0
          if [ -f keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in keystore.enc -out ~/.android/debug.keystore -pass env:KS_PASS
            if ! keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "::warning::keystore.enc acildi ama GECERSIZ (sifre degismis ya da dosya bozuk). Yeni anahtar uretilecek - telefonda BIR KEZ sil-kur gerekebilir."
              YENI=1
            fi
          else
            echo "keystore.enc depoda yok - ilk kez uretilecek."
            YENI=1
          fi
          if [ "$YENI" = "1" ]; then
            rm -f ~/.android/debug.keystore
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Android Debug,O=Android,C=US"
            openssl enc -aes-256-cbc -pbkdf2 -salt -in ~/.android/debug.keystore -out keystore.enc -pass env:KS_PASS
            FP="$(parmakizi ~/.android/debug.keystore)"
            echo "$FP" > imza.txt
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore.enc imza.txt
            git commit -m "Imza anahtari (sifreli) + imza.txt"
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo "Yeni imza anahtari depoya kaydedildi. Telefonda BIR KEZ sil-kur gerekecek; sonrasinda tum guncellemeler ustune kurulur."
            else
              echo "::error::imza anahtari depoya YAZILAMADI! Ayni anahtar bir daha uretilemeyecegi icin derleme durduruldu. Yedek 'imza-yedek' artifact'ine alindi - onu sakla."
              mkdir -p ksbackup
              cp keystore.enc imza.txt ksbackup/ || true
              exit 1
            fi
          else
            FP="$(parmakizi ~/.android/debug.keystore)"
            if [ -f imza.txt ] && [ -n "$FP" ] && [ "$FP" != "$(cat imza.txt)" ]; then
              echo "::error::IMZA UYUSMUYOR! Depodaki imza.txt: $(cat imza.txt) | bu derlemedeki anahtar: $FP"
              echo "Anahtar degismis olur - kurul uygulamalar ustune kurulamaz. Derleme durduruldu."
              exit 1
            fi
          fi
          if [ -z "$FP" ]; then echo "::error::imza parmak izi okunamadi"; exit 1; fi
          echo "IMZA (SHA-256): $FP"
          echo "IMZA_FP=$FP" >> "$GITHUB_ENV"
          echo "### APK imzasi" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$FP" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Bu satir her derlemede AYNI kalirsa yeni APK her zaman ustune kurulur." >> "$GITHUB_STEP_SUMMARY"

      - name: Imza yedegini yukle (yalniz hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: imza-yedek
          path: |
            keystore.enc
            imza.txt
          if-no-files-found: ignore

      - name: Bagimliliklari kur
        run: npm install

      - name: Web dosyalarini hazirla
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png 70-kilit-kasa.png www/

      - name: Android projesini hazirla
        run: |
          if [ ! -f android/gradlew ]; then npx cap add android; fi
          npx cap sync android

      # ------------------------------------------------------------------
      # IMZAYI GRADLE'A SABITLE: varsayilan "~/.android keystore'unu Gradle
      # kendiliginden bulsun" yontemi bu runner'da calismiyor (her seferinde
      # AGP kendi anahtarinı uretiyordu). Simdi anahtar PROJEYE kopyalanir ve
      # signingConfig ACIKCA bildirilir -> imza garantili sabit.
      # versionCode her derlemede run numarasina esitlenir -> guncelleme sorunsuz.
      # ------------------------------------------------------------------
      - name: Imzayi Gradle'a sabitle + surum numarasi
        run: |
          cp ~/.android/debug.keystore android/app/portfoy.keystore
          cat >> android/app/build.gradle <<EOF

          android {
              defaultConfig {
                  versionCode ${GITHUB_RUN_NUMBER}
                  versionName "1.${GITHUB_RUN_NUMBER}"
              }
              signingConfigs {
                  debug {
                      storeFile file('portfoy.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          echo "versionCode = ${GITHUB_RUN_NUMBER}"

      - name: Biyometrik iznini ekle
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q USE_BIOMETRIC $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' $M
          grep -n BIOMETRIC $M

      - name: Cuzdan ikonunu Android boyutlarina uygula
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q imagemagick
          R=android/app/src/main/res
          mkdir -p $R/mipmap-mdpi $R/mipmap-hdpi $R/mipmap-xhdpi $R/mipmap-xxhdpi $R/mipmap-xxxhdpi
          mkdir -p $R/drawable-mdpi $R/drawable-hdpi $R/drawable-xhdpi $R/drawable-xxhdpi $R/drawable-xxxhdpi
          convert icon-maskable-512.png -resize 192x192 $R/mipmap-xxxhdpi/ic_launcher.png
          convert icon-maskable-512.png -resize 144x144 $R/mipmap-xxhdpi/ic_launcher.png
          convert icon-maskable-512.png -resize 96x96  $R/mipmap-xhdpi/ic_launcher.png
          convert icon-maskable-512.png -resize 72x72  $R/mipmap-hdpi/ic_launcher.png
          convert icon-maskable-512.png -resize 48x48  $R/mipmap-mdpi/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png; done
          convert icon-maskable-512.png -resize 250x250 _fg.png
          convert -size 432x432 xc:'rgb(12,17,28)' _fg.png -geometry +91+91 -composite _fg432.png
          convert _fg432.png -resize 432x432 $R/drawable-xxxhdpi/ic_launcher_foreground.png
          convert _fg432.png -resize 324x324 $R/drawable-xxhdpi/ic_launcher_foreground.png
          convert _fg432.png -resize 216x216 $R/drawable-xhdpi/ic_launcher_foreground.png
          convert _fg432.png -resize 162x162 $R/drawable-hdpi/ic_launcher_foreground.png
          convert _fg432.png -resize 108x108 $R/drawable-mdpi/ic_launcher_foreground.png
          convert _fg432.png -resize 432x432 $R/mipmap-xxxhdpi/ic_launcher_foreground.png
          convert _fg432.png -resize 324x324 $R/mipmap-xxhdpi/ic_launcher_foreground.png
          convert _fg432.png -resize 216x216 $R/mipmap-xhdpi/ic_launcher_foreground.png
          convert _fg432.png -resize 162x162 $R/mipmap-hdpi/ic_launcher_foreground.png
          convert _fg432.png -resize 108x108 $R/mipmap-mdpi/ic_launcher_foreground.png

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Imzayi dogrula (ayni anahtar mi?)
        run: |
          FP2=$(keytool -printcert -jarfile portfoy.apk 2>/dev/null | grep -m1 'SHA256:' | sed 's/^[[:space:]]*//')
          echo "APK imzasi : $FP2"
          echo "Beklenen   : $IMZA_FP"
          if [ -n "$IMZA_FP" ] && [ "$FP2" != "$IMZA_FP" ]; then
            echo "::error::APK beklenen anahtarla IMZANMAMIS! Yayin durduruldu."
            exit 1
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$FP2" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: APK dosyasini hazirla
        run: cp android/app/build/outputs/apk/debug/app-debug.apk portfoy.apk

      - name: Release olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Portföyüm APK ${{ github.run_number }}
          files: portfoy.apk
