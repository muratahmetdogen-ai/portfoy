name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ------------------------------------------------------------------
      # IMZA ANAHTARI (v2 - guclendirilmis)
      # - keystore.enc depodan cozulur ve GECERLILIGI test edilir
      #   (openssl yanlis sifreyi SESSIZCE bozuk dosya uretir; o yuzden keytool ile dogrulariz)
      # - gecersizse yeni anahtar uretilir, depoya yazilir, PARMAK IZI imza.txt'ye yazilir
      # - imza.txt VARSA ve anahtar uyusmuyorsa derleme HATA verir
      #   -> bir daha asla sessizce "ustune kurulmayan" APK cikmaz
      # ------------------------------------------------------------------
      - name: Imza anahtarini hazirla (dogrulamali)
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -e
          if [ -z "$KS_PASS" ]; then echo "::error::KEYSTORE_PASS gizli anahtari tanimli degil (Settings > Secrets and variables > Actions)"; exit 1; fi
          mkdir -p ~/.android
          parmakizi() { keytool -list -v -keystore "$1" -storepass android -alias androiddebugkey 2>/dev/null | grep -m1 'SHA256:' | sed 's/^[[:space:]]*//'; }
          YENI=0
          if [ -f keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in keystore.enc -out ~/.android/debug.keystore -pass env:KS_PASS
            if ! keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "::warning::keystore.enc acildi ama GECERSIZ (sifre degismis ya da dosya bozuk). Yeni anahtar uretilecek - telefonda BIR KEZ sil-kur gerekebilir."
              YENI=1
            fi
          else
            echo "keystore.enc depoda yok - ilk kez uretilecek."
            YENI=1
          fi
          if [ "$YENI" = "1" ]; then
            rm -f ~/.android/debug.keystore
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Android Debug,O=Android,C=US"
            openssl enc -aes-256-cbc -pbkdf2 -salt -in ~/.android/debug.keystore -out keystore.enc -pass env:KS_PASS
            FP="$(parmakizi ~/.android/debug.keystore)"
            echo "$FP" > imza.txt
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore.enc imza.txt
            git commit -m "Imza anahtari (sifreli) + imza.txt"
